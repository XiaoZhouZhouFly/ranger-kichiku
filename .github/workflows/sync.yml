# GitHub 執行環境（v6.1）：作業系統固定 ubuntu-24.04（不用 ubuntu-latest，避免 GitHub 換成新版 Ubuntu 時突然壞掉；
# 要升級時改這裡的三個 runs-on，再手動跑一次確認）。官方 Actions 都用 Node.js 24 的版本。
name: 同步角色資料並發布網站

on:
  schedule:
    - cron: "17 19 * * *"   # 每天台灣時間 03:17（UTC 19:17）
  workflow_dispatch:         # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安裝 Pillow（格鬥場判定距離用；裝不起來也照樣同步）
        run: pip install pillow || true

      - name: 同步資料
        run: python sync.py

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -q -m "同步角色資料 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # 自動健檢：測試「即將發布的那一份網站」，沒過就不發布（網站維持上一個正常版本）
  healthcheck:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tests
            src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 檢查 index.html 是不是由 src/ 產生（忘了一起上傳時會在這裡擋下）
        run: python build.py --check
      - name: 取得即將發布的網站
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: _pages
      # 網站包通常是 _pages/artifact.tar；新版 download-artifact 不一定自動解壓，所以自己找 .tar，找不到就當成已經解開
      - name: 解開網站包
        run: |
          mkdir -p _site
          t=$(find _pages -name '*.tar' | head -1)
          if [ -n "$t" ]; then tar -xf "$t" -C _site; else cp -r _pages/. _site/; fi
          test -f _site/index.html
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: 安裝測試用瀏覽器
        working-directory: tests
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 自動健檢
        run: node tests/healthcheck.mjs _site
      - name: 失敗時保存截圖
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: healthcheck-screenshots
          path: tests/out
          retention-days: 14

  deploy:
    needs: healthcheck
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
