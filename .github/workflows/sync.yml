name: 同步角色資料並發布網站

on:
  schedule:
    - cron: "17 19 * * *"   # 每天台灣時間 03:17（UTC 19:17）
  workflow_dispatch:         # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步資料
        run: python sync.py

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -q -m "同步角色資料 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 自動健檢：測試「即將發布的那一份網站」，沒過就不發布（網站維持上一個正常版本）
  healthcheck:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests
      - name: 取得即將發布的網站
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _pages
      - run: mkdir -p _site && tar -xf _pages/artifact.tar -C _site
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安裝測試用瀏覽器
        working-directory: tests
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: 自動健檢
        run: node tests/healthcheck.mjs _site
      - name: 失敗時保存截圖
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-screenshots
          path: tests/out
          retention-days: 14

  deploy:
    needs: healthcheck
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
